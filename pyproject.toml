[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "connectvpn"
version = "0.3.6"
description = "Terminal UI and CLI for managing OpenVPN profiles with one shared credential file."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "connectvpn contributors" }
]
keywords = ["openvpn", "protonvpn", "vpn", "tui", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console :: Curses",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Networking",
]

[project.urls]
Homepage = "https://github.com/deepdevjose/vpn"
Repository = "https://github.com/deepdevjose/vpn"
Issues = "https://github.com/deepdevjose/vpn/issues"

[project.scripts]
connectvpn = "connectvpn.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
